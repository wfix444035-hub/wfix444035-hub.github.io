<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品展示與評論區</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        /* 防盜圖容器 */
        .image-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
        }
        .image-wrapper img {
            width: 100%;
            display: block;
            border-radius: 4px;
            pointer-events: none; 
        }
        /* 透明防盜遮罩：確保點不到圖片，且浮水印在這個層級之上 */
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0); 
            z-index: 100;
        }
        /* 浮水印層：移到最高層級，改用文字背景覆蓋，保證看得到 */
        .watermark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='150' height='150' viewBox='0 0 150 150'><text x='0' y='80' fill='rgba(255,255,255,0.4)' font-size='16' font-family='Arial' font-weight='bold' transform='rotate(-30 50 80)'>勿拿</text></svg>");
            background-repeat: repeat;
        }
        /* 評論區樣式 */
        .comment-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

    <div class="container">
        <h1>我的圖片作品</h1>
        
        <!-- 圖片區 -->
        <div class="image-wrapper">
            <img src="file_0000000082b88209a87529a60630e773~2.jpg" alt="作品圖片">
            <div class="watermark"></div>
            <div class="image-overlay"></div>
        </div>
        
        <p style="color: red; text-align: center; font-size: 14px;">⚠️ 本站圖片受版權保護，已啟用最高等級防盜機制，禁止下載。</p>

        <!-- 評論區（換成超穩定的免密碼萬用留言板） -->
        <div class="comment-section">
            <h3>訪客評論區</h3>
            <iframe src="https://cdpn.io" width="100%" height="450" frameborder="0" style="border:1px solid #ddd; border-radius:4px;"></iframe>
        </div>
    </div>

    <script>
        document.onkeydown = function(e) {
            if (e.keyCode == 123) { return false; } 
            if (e.ctrlKey && e.shiftKey && e.keyCode == 73) { return false; } 
            if (e.ctrlKey && e.shiftKey && e.keyCode == 67) { return false; } 
            if (e.ctrlKey && e.keyCode == 85) { return false; } 
        };
    </script>
</body>
</html>
