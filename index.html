<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai作品展示與評論區</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        /* 防盜圖容器 */
        .image-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
        }
        .image-wrapper img {
            width: 100%;
            display: block;
            border-radius: 4px;
            pointer-events: none; 
        }
        /* 最上層：透明防盜遮罩 */
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0); 
            z-index: 1000;
        }
        /* 浮水印層：超亮白色加粗，保證在暗色月亮上清清楚楚 */
        .watermark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='180' height='180' viewBox='0 0 180 180'><text x='10' y='100' fill='rgba(255,255,255,0.45)' font-size='18' font-family='Arial' font-weight='bold' transform='rotate(-30 50 100)'>版權所有 翻印必究</text></svg>");
            background-repeat: repeat;
        }
        /* 網頁內建留言板樣式 */
        .comment-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .comment-box {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 80px;
            margin-bottom: 10px;
            resize: none;
        }
        .comment-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .comment-list {
            margin-top: 20px;
            list-style: none;
            padding: 0;
        }
        .comment-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 4px solid #007bff;
            font-size: 14px;
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

    <div class="container">
        <h1>我的圖片作品</h1>
        
        <!-- 圖片區 -->
        <div class="image-wrapper">
            <img src="file_0000000082b88209a87529a60630e773~2.jpg" alt="作品圖片">
            <div class="watermark"></div>
            <div class="image-overlay"></div>
        </div>
        
        <p style="color: red; text-align: center; font-size: 14px;"勿拿。</p>

        <!-- 網頁內建獨立留言板（100%可打字） -->
        <div class="comment-section">
            <h3>訪客評論區</h3>
            <textarea id="commentInput" class="comment-box" placeholder="在這裡輸入你的評論..."></textarea>
            <button class="comment-btn" onclick="addComment()">發表評論</button>
            <ul id="commentList" class="comment-list">
                <li class="comment-item">🎉 歡迎來到我的作品展示區！歡迎在上方留下你的看法。</li>
            </ul>
        </div>
    </div>

    <script>
        // 內建留言板互動功能
        function addComment() {
            var input = document.getElementById('commentInput');
            var text = input.value.trim();
            if (text === '') {
                alert('請先輸入評論內容喔！');
                return;
            }
            var li = document.createElement('li');
            li.className = 'comment-item';
            li.innerText = '訪客：' + text;
            document.getElementById('commentList').appendChild(li);
            input.value = '';
        }

        // 阻擋電腦檢查行為
        document.onkeydown = function(e) {
            if (e.keyCode == 123) { return false; } 
            if (e.ctrlKey && e.shiftKey && e.keyCode == 73) { return false; } 
            if (e.ctrlKey && e.shiftKey && e.keyCode == 67) { return false; } 
            if (e.ctrlKey && e.keyCode == 85) { return false; } 
        };
    </script>
</body>
</html>
